<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6f73">
<meta name="description" content="Application privée pour apprendre les langues">
<title>Lingua – Français</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">L</span><span id="brandName">Lingua</span></div>
  <div class="top-stats">
    <button class="pill" id="audioPill" data-act="toggleAudio" aria-label="Son">🔊</button>
    <span class="pill" id="streakPill" title="Série">🔥 0</span>
    <span class="pill" id="xpPill" title="XP">⭐ 0</span>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<nav class="bottomnav" id="nav">
  <a href="#home" data-nav="home"><span>🏠</span><small>Accueil</small></a>
  <a href="#progres" data-nav="progres"><span>📈</span><small>Progrès</small></a>
  <a href="#reglages" data-nav="reglages"><span>⚙️</span><small>Réglages</small></a>
</nav>
<div id="toast" class="toast" role="status"></div>
<div id="updateBar" class="updatebar" hidden>Nouvelle version disponible <button data-act="applyUpdate">Recharger</button></div>
<script src="lang/fr/pack.js"></script>
<script src="lang/fr/vocab-extra.js"></script>
<script src="lang/fr/gaps-extra.js"></script>
<script src="lang/fr/quiz-extra.js"></script>
<script src="lang/fr/test-extra.js"></script>
<script src="lang/fr/m1-textes.js"></script>
<script src="lang/fr/m1-dialogues.js"></script>
<script src="lang/fr/m1-exercices.js"></script>
<script src="lang/fr/conjugaison.js"></script>
<script src="lang/fr/oral.js"></script>
<script src="js/app.js"></script>
</body>
</html>
